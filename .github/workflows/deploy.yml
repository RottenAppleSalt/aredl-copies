# Rebuilds data.json from the AREDL API every hour and publishes the site to GitHub Pages.
# Nothing is committed back to the repo; each run deploys a fresh build.
name: Update data and deploy

on:
  schedule:
    - cron: "5 * * * *"   # every hour at :05
  push:
    branches: [main]
  workflow_dispatch:      # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch every level's copies from the AREDL API
        run: python scripts/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
